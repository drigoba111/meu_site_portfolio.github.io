<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rota completa + payload de tempos de parada (Version10)</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; }
    .wrap { display:grid; grid-template-columns:500px 1fr; gap:12px; padding:12px; }
    .panel { border:1px solid #ddd; border-radius:10px; padding:12px; }
    #map { width:100%; height:92vh; border:1px solid #ddd; border-radius:10px; background:#f7f7f7; }
    label { display:block; margin-top:8px; font-weight:600; }
    input, textarea, button, select { width:100%; box-sizing:border-box; padding:8px; margin-top:4px; }
    textarea { min-height:120px; }
    #stops { min-height:140px; }
    #stopDurations { min-height:100px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .actions { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:8px; }
    .ok{ color:#0b8043; font-weight:700 }
    .err{ color:#c5221f; font-weight:700 }
    .warn{ color:#b26a00; font-weight:700 }
    pre { background:#111; color:#eee; padding:10px; border-radius:8px; overflow:auto; max-height:260px; }
    .legend { margin-top:10px; line-height:1.6; font-size:13px; }
    .chip { display:inline-block; min-width:20px; text-align:center; color:#fff; border-radius:999px; padding:2px 8px; font-weight:700; margin-right:6px; }
    .start{ background:#0b8043 } .stop{ background:#1a73e8 } .end{ background:#c5221f }
    .small { font-size:12px; color:#555; }
    table { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
    th, td { border:1px solid #ddd; padding:6px; text-align:left; }
    th { background:#f6f6f6; }
    .muted { color:#666; font-size:12px; margin-top:4px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h3 style="margin-top:0">Rota completa (Version10)</h3>

    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="YOUR_API_KEY" />

    <label>Origem</label>
    <select id="originMode">
      <option value="address" selected>Usar endereço digitado</option>
      <option value="device">Usar minha localização agora</option>
    </select>

    <div id="originAddressWrap">
      <label>Início (Origem por endereço)</label>
      <input id="origin" value="Av. Paulista, 1000, São Paulo - SP" />
    </div>

    <div id="originDeviceWrap" style="display:none;">
      <button id="btnGetLocation" type="button">Capturar minha localização agora</button>
      <div id="originDeviceInfo" class="muted">Nenhuma localização capturada ainda.</div>
    </div>

    <label>Fim (Destino)</label>
    <input id="destination" value="Aeroporto de Congonhas, São Paulo - SP" />

    <label>Paradas intermediárias (uma por linha)</label>
    <textarea id="stops">Rua Funchal, 500, São Paulo - SP
Shopping Eldorado, São Paulo - SP
Museu da Imagem e do Som, São Paulo - SP
Parque Ibirapuera, São Paulo - SP</textarea>

    <label>Minutos por parada (opcional, uma linha por parada na mesma ordem)</label>
    <textarea id="stopDurations" placeholder="Exemplo:
15
10
20
5"></textarea>

    <div class="row">
      <div>
        <label>Minutos padrão por parada</label>
        <input id="minutesPerStopDefault" type="number" min="0" step="1" value="10" />
      </div>
      <div>
        <label>Tipo de condução</label>
        <select id="travelMode">
          <option value="DRIVE" selected>Carro</option>
          <option value="TWO_WHEELER">Moto</option>
          <option value="BICYCLE">Bicicleta</option>
          <option value="WALK">A pé</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Preferência de trânsito</label>
        <select id="routingPreference">
          <option value="TRAFFIC_UNAWARE">TRAFFIC_UNAWARE</option>
          <option value="TRAFFIC_AWARE" selected>TRAFFIC_AWARE</option>
          <option value="TRAFFIC_AWARE_OPTIMAL">TRAFFIC_AWARE_OPTIMAL</option>
        </select>
      </div>
      <div>
        <label>Otimizar ordem das paradas</label>
        <select id="optimizeOrder">
          <option value="true" selected>Sim</option>
          <option value="false">Não</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Partida</label>
        <select id="departureMode">
          <option value="soon" selected>Sair em +5 minutos</option>
          <option value="manual">Escolher data/hora</option>
          <option value="none">Não enviar departureTime</option>
        </select>
      </div>
      <div>
        <label>Data/hora (manual)</label>
        <input id="manualDeparture" type="datetime-local" />
      </div>
    </div>

    <div class="actions">
      <button id="btnShow">Quero ver no mapa</button>
      <button id="btnOpenGoogleMaps">Abrir Google Maps (web)</button>
      <button id="btnOpenGoogleMapsApp">Abrir Google Maps (app)</button>
    </div>

    <div id="status" style="margin-top:10px;"></div>
    <div id="summary"></div>
    <div id="legDetails"></div>

    <details style="margin-top:10px;">
      <summary>Payload custom (para backend otimizar com tempo de parada)</summary>
      <pre id="payloadPreview"></pre>
    </details>

    <details style="margin-top:10px;">
      <summary>Logs/Debug</summary>
      <pre id="debug"></pre>
    </details>
  </div>

  <div class="panel">
    <div id="map"></div>
  </div>
</div>

<script>
  // Mantive estrutura principal; aqui só foco no ajuste de tempos de parada em payload e soma final.
  const ROUTES_URL = "https://routes.googleapis.com/directions/v2:computeRoutes";

  let map, markers = [], polylines = [];
  let lastOrderedStops = [];
  let lastOrigin = null, lastOriginCoord = null, lastDestination = null;
  let deviceLocation = null;
  let debugLines = [];

  const logDebug = (m,o)=>{ const l=o?`${m}\n${JSON.stringify(o,null,2)}`:m; debugLines.push(l); document.getElementById("debug").textContent=debugLines.join("\n\n---\n\n"); };
  const setStatus = (m,t="ok")=>{ const e=document.getElementById("status"); e.className=t; e.textContent=m; };
  const parseStops = t => t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const parseDurationLines = t => t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(v=>Math.max(0, parseInt(v,10)||0));
  const durationToSec = d => { const n=parseInt(String(d||"").replace("s",""),10); return Number.isNaN(n)?0:n; };
  const formatSec = sec => `${Math.floor(sec/3600)}h ${Math.floor((sec%3600)/60)}min`;
  const formatLatLng = ll => `${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}`;

  function ensureMap() {
    if (!window.google || !google.maps) throw new Error("Maps JS não carregou.");
    if (!map) map = new google.maps.Map(document.getElementById("map"), { center:{lat:-23.5505,lng:-46.6333}, zoom:11 });
  }
  function clearMap(){ markers.forEach(m=>m.setMap(null)); markers=[]; polylines.forEach(p=>p.setMap(null)); polylines=[]; }
  function addMarker(position, labelText, title, kind, legInfoText="") {
    const colors={start:"#0b8043",stop:"#1a73e8",end:"#c5221f"};
    const marker = new google.maps.Marker({
      position, map, title: legInfoText?`${title} • ${legInfoText}`:title,
      label:{text:labelText,color:"#fff",fontWeight:"700"},
      icon:{path:google.maps.SymbolPath.CIRCLE,fillColor:colors[kind],fillOpacity:1,strokeColor:"#fff",strokeWeight:2,scale:11}
    });
    markers.push(marker);
  }
  function decodePolyline(encoded){let i=0,lat=0,lng=0,c=[];while(i<encoded.length){let b,s=0,r=0;do{b=encoded.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);lat+=(r&1)?~(r>>1):(r>>1);s=0;r=0;do{b=encoded.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);lng+=(r&1)?~(r>>1):(r>>1);c.push({lat:lat/1e5,lng:lng/1e5});}return c;}

  function getDepartureTimeISO(){
    const mode=document.getElementById("departureMode").value;
    const manual=document.getElementById("manualDeparture").value;
    if(mode==="none") return null;
    if(mode==="soon") return new Date(Date.now()+5*60*1000).toISOString();
    if(!manual) throw new Error("Preencha a data/hora manual.");
    const d=new Date(manual); if(isNaN(d.getTime())) throw new Error("Data/hora manual inválida.");
    return d.toISOString();
  }

  function explainGeoError(err){ if(!err) return "Erro desconhecido."; if(err.code===1) return "Permissão negada."; if(err.code===2) return "Posição indisponível."; if(err.code===3) return "Timeout de geolocalização."; return err.message||"Falha geolocalização."; }
  async function captureDeviceLocation(){
    if(!window.isSecureContext && location.hostname!=="localhost" && location.hostname!=="127.0.0.1") throw new Error("Abra em HTTPS/localhost.");
    if(!navigator.geolocation) throw new Error("Geolocalização não suportada.");
    const pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000,maximumAge:0}));
    deviceLocation={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy};
    document.getElementById("originDeviceInfo").textContent=`Localização: ${formatLatLng(deviceLocation)} (±${Math.round(deviceLocation.accuracy)}m)`;
  }
  async function ensureDeviceLocationIfNeeded(){ if(document.getElementById("originMode").value==="device" && !deviceLocation) await captureDeviceLocation(); }
  function getOriginInput(){
    if(document.getElementById("originMode").value==="device"){
      if(!deviceLocation) throw new Error("Sem localização atual.");
      return { forApi:{ location:{ latLng:{ latitude:deviceLocation.lat, longitude:deviceLocation.lng } } }, label:`Minha localização (${formatLatLng(deviceLocation)})`, coord:{...deviceLocation}, text:null };
    }
    const originText=document.getElementById("origin").value.trim();
    if(!originText) throw new Error("Informe origem.");
    return { forApi:{ address:originText }, label:originText, coord:null, text:originText };
  }

  function buildPerStopDurations(orderedStops){
    const defaultMin = Math.max(0, parseInt(document.getElementById("minutesPerStopDefault").value||"0",10)||0);
    const customLines = parseDurationLines(document.getElementById("stopDurations").value);

    // Aplica por índice da ordem final (simples para frontend).
    // Se quiser mapear por endereço exato, também posso ajustar.
    return orderedStops.map((stop, idx) => ({
      stop,
      stopDurationMinutes: customLines[idx] ?? defaultMin
    }));
  }

  function renderPayloadPreview(originInput, destination, orderedStops, routingPreference, travelMode){
    const perStop = buildPerStopDurations(orderedStops);
    const payload = {
      origin: originInput.coord ? { lat: originInput.coord.lat, lng: originInput.coord.lng } : originInput.text,
      destination,
      travelMode,
      routingPreference,
      stops: perStop
    };
    document.getElementById("payloadPreview").textContent = JSON.stringify(payload, null, 2);
    return payload;
  }

  async function loadMapsScript(apiKey){
    return new Promise((resolve,reject)=>{
      if(window.google&&window.google.maps) return resolve();
      window.__initMap=()=>resolve();
      const s=document.createElement("script");
      s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&v=weekly&callback=__initMap`;
      s.async=true; s.defer=true; s.onerror=()=>reject(new Error("Falha Maps JS"));
      document.head.appendChild(s);
    });
  }

  async function computeRoute(apiKey, originForApi, destination, stops, routingPreference, travelMode, optimizeWaypointOrder, departureISO){
    const body = {
      origin: originForApi,
      destination: { address: destination },
      intermediates: stops.map(s=>({address:s})),
      travelMode,
      routingPreference,
      optimizeWaypointOrder,
      languageCode:"pt-BR",
      units:"METRIC"
    };
    if(departureISO) body.departureTime = departureISO;

    const res = await fetch(ROUTES_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "X-Goog-Api-Key":apiKey,
        "X-Goog-FieldMask":"routes.distanceMeters,routes.duration,routes.polyline.encodedPolyline,routes.optimizedIntermediateWaypointIndex,routes.legs.distanceMeters,routes.legs.duration,routes.legs.steps.startLocation.latLng,routes.legs.steps.endLocation.latLng"
      },
      body: JSON.stringify(body)
    });

    const text = await res.text();
    let data={}; try{data=JSON.parse(text);}catch{data={raw:text};}
    logDebug(`computeRoutes HTTP ${res.status}`, data);

    if(!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
    const route = data.routes?.[0];
    if(!route) throw new Error("Nenhuma rota retornada.");

    const idx = route.optimizedIntermediateWaypointIndex || [];
    const orderedStops = idx.length ? idx.map(i=>stops[i]) : stops.slice();

    return { route, orderedStops };
  }

  function onOriginModeChange(){
    const mode=document.getElementById("originMode").value;
    document.getElementById("originAddressWrap").style.display = mode==="address"?"block":"none";
    document.getElementById("originDeviceWrap").style.display = mode==="device"?"block":"none";
  }

  function buildGoogleMapsWebUrl(originRef, destination, orderedStops, travelMode){
    const params = new URLSearchParams();
    params.set("api","1");
    params.set("origin", typeof originRef==="string" ? originRef : `${originRef.lat},${originRef.lng}`);
    params.set("destination", destination);
    const modeMap={DRIVE:"driving",TWO_WHEELER:"driving",BICYCLE:"bicycling",WALK:"walking"};
    params.set("travelmode", modeMap[travelMode] || "driving");
    if(orderedStops?.length) params.set("waypoints", orderedStops.join("|"));
    return `https://www.google.com/maps/dir/?${params.toString()}`;
  }

  function openInGoogleMapsWeb(){
    if(!lastDestination) return setStatus("Calcule a rota primeiro.","err");
    const originRef = lastOriginCoord || lastOrigin;
    if(!originRef) return setStatus("Origem inválida.","err");
    const travelMode=document.getElementById("travelMode").value;
    window.open(buildGoogleMapsWebUrl(originRef,lastDestination,lastOrderedStops,travelMode), "_blank", "noopener,noreferrer");
  }

  function openInGoogleMapsApp(){ openInGoogleMapsWeb(); } // fallback simples

  async function showMapFlow(){
    debugLines=[];
    document.getElementById("debug").textContent="";
    document.getElementById("summary").innerHTML="";
    document.getElementById("legDetails").innerHTML="";
    document.getElementById("payloadPreview").textContent="";

    const apiKey=document.getElementById("apiKey").value.trim();
    const destination=document.getElementById("destination").value.trim();
    const stops=parseStops(document.getElementById("stops").value);
    const travelMode=document.getElementById("travelMode").value;
    const routingPreference=document.getElementById("routingPreference").value;
    const optimizeWaypointOrder=document.getElementById("optimizeOrder").value==="true";
    const departureISO=getDepartureTimeISO();

    if(!apiKey) throw new Error("Informe a API key.");
    if(!destination) throw new Error("Informe destino.");

    await ensureDeviceLocationIfNeeded();
    const originInput=getOriginInput();

    setStatus("1/3 Carregando mapa...","warn");
    await loadMapsScript(apiKey);

    setStatus("2/3 Calculando rota...","warn");
    const { route, orderedStops } = await computeRoute(
      apiKey, originInput.forApi, destination, stops, routingPreference, travelMode, optimizeWaypointOrder, departureISO
    );

    setStatus("3/3 Desenhando...","warn");
    ensureMap(); clearMap();

    const path = decodePolyline(route.polyline?.encodedPolyline || "");
    const line = new google.maps.Polyline({ path, map, strokeColor:"#1a73e8", strokeOpacity:0.95, strokeWeight:5 });
    polylines.push(line);

    const bounds = new google.maps.LatLngBounds();
    path.forEach(p=>bounds.extend(p));

    const legs = route.legs || [];
    const legDetails = [];
    for(let i=0;i<legs.length;i++){
      legDetails.push({
        from: i===0 ? originInput.label : orderedStops[i-1],
        to: i<orderedStops.length ? orderedStops[i] : destination,
        distanceMeters: legs[i].distanceMeters || 0,
        durationSec: durationToSec(legs[i].duration)
      });
    }

    // marcadores aproximados pelos steps
    if(legs.length){
      const s0=legs[0].steps?.[0]?.startLocation?.latLng;
      if(s0){ addMarker({lat:s0.latitude,lng:s0.longitude},"I",`Início: ${originInput.label}`,"start"); bounds.extend({lat:s0.latitude,lng:s0.longitude}); }

      for(let i=0;i<orderedStops.length;i++){
        const e=legs[i]?.steps?.[legs[i].steps.length-1]?.endLocation?.latLng;
        if(!e) continue;
        const info = legDetails[i] ? `${(legDetails[i].distanceMeters/1000).toFixed(2)} km • ${formatSec(legDetails[i].durationSec)}` : "";
        addMarker({lat:e.latitude,lng:e.longitude}, String(i+1), `Parada ${i+1}: ${orderedStops[i]}`, "stop", info);
        bounds.extend({lat:e.latitude,lng:e.longitude});
      }

      const le=legs[legs.length-1]?.steps?.[legs[legs.length-1].steps.length-1]?.endLocation?.latLng;
      if(le){
        const lastInfo = legDetails[legDetails.length-1] ? `${(legDetails[legDetails.length-1].distanceMeters/1000).toFixed(2)} km • ${formatSec(legDetails[legDetails.length-1].durationSec)}` : "";
        addMarker({lat:le.latitude,lng:le.longitude},"F",`Fim: ${destination}`,"end",lastInfo);
        bounds.extend({lat:le.latitude,lng:le.longitude});
      }
    }

    if(!bounds.isEmpty()) map.fitBounds(bounds);

    // tempo de parada custom
    const payloadCustom = renderPayloadPreview(originInput, destination, orderedStops, routingPreference, travelMode);
    const totalTransitSec = legDetails.reduce((a,b)=>a+b.durationSec,0);
    const totalStopSec = payloadCustom.stops.reduce((a,b)=>a + (b.stopDurationMinutes*60), 0);
    const adjustedSec = totalTransitSec + totalStopSec;

    lastOrigin = originInput.text;
    lastOriginCoord = originInput.coord;
    lastDestination = destination;
    lastOrderedStops = orderedStops;

    document.getElementById("summary").innerHTML = `
      <p><strong>Origem usada:</strong> ${originInput.label}</p>
      <p><strong>Tipo de condução:</strong> ${travelMode}</p>
      <p><strong>Paradas:</strong> ${orderedStops.length}</p>
      <p><strong>Distância total:</strong> ${((route.distanceMeters||0)/1000).toFixed(2)} km</p>
      <p><strong>Tempo em trânsito:</strong> ${formatSec(totalTransitSec)}</p>
      <p><strong>Tempo de paradas (payload):</strong> ${formatSec(totalStopSec)}</p>
      <p><strong>Tempo total ajustado:</strong> ${formatSec(adjustedSec)}</p>
    `;

    const rows = legDetails.map((x,i)=>`
      <tr><td>${i+1}</td><td>${x.from}</td><td>${x.to}</td><td>${(x.distanceMeters/1000).toFixed(2)} km</td><td>${formatSec(x.durationSec)}</td></tr>
    `).join("");
    document.getElementById("legDetails").innerHTML = `
      <h4>Tempo e distância por trecho</h4>
      <table><thead><tr><th>#</th><th>De</th><th>Para</th><th>Distância</th><th>Duração</th></tr></thead><tbody>${rows}</tbody></table>
    `;

    setStatus("OK: rota calculada com payload de tempos de parada.", "ok");
  }

  document.getElementById("originMode").addEventListener("change", onOriginModeChange);

  document.getElementById("btnGetLocation").addEventListener("click", async () => {
    try {
      setStatus("Capturando localização...", "warn");
      await captureDeviceLocation();
      setStatus("Localização capturada.", "ok");
    } catch (e) {
      setStatus(`Falha localização: ${explainGeoError(e)}`, "err");
      logDebug("Erro geolocalização", { message:e.message, code:e.code||null });
    }
  });

  document.getElementById("btnShow").addEventListener("click", async () => {
    try { await showMapFlow(); }
    catch (e) { logDebug("Erro capturado", {message:e.message, stack:e.stack}); setStatus(e.message, "err"); }
  });

  document.getElementById("btnOpenGoogleMaps").addEventListener("click", openInGoogleMapsWeb);
  document.getElementById("btnOpenGoogleMapsApp").addEventListener("click", openInGoogleMapsApp);

  onOriginModeChange();
</script>
</body>
</html>
