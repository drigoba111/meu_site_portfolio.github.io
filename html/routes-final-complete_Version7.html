<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rota completa + tentativa de stopDuration no payload (Version11)</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; }
    .wrap { display:grid; grid-template-columns:500px 1fr; gap:12px; padding:12px; }
    .panel { border:1px solid #ddd; border-radius:10px; padding:12px; }
    #map { width:100%; height:92vh; border:1px solid #ddd; border-radius:10px; background:#f7f7f7; }
    label { display:block; margin-top:8px; font-weight:600; }
    input, textarea, button, select { width:100%; box-sizing:border-box; padding:8px; margin-top:4px; }
    textarea { min-height:120px; }
    #stops { min-height:140px; }
    #stopDurations { min-height:100px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .actions { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:8px; }
    .ok{ color:#0b8043; font-weight:700 }
    .err{ color:#c5221f; font-weight:700 }
    .warn{ color:#b26a00; font-weight:700 }
    pre { background:#111; color:#eee; padding:10px; border-radius:8px; overflow:auto; max-height:260px; }
    .small { font-size:12px; color:#555; }
    table { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
    th, td { border:1px solid #ddd; padding:6px; text-align:left; }
    th { background:#f6f6f6; }
    .muted { color:#666; font-size:12px; margin-top:4px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h3 style="margin-top:0">Rota (Version11)</h3>

    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="YOUR_API_KEY" />

    <label>Origem</label>
    <select id="originMode">
      <option value="address" selected>Usar endereço digitado</option>
      <option value="device">Usar minha localização agora</option>
    </select>

    <div id="originAddressWrap">
      <label>Início</label>
      <input id="origin" value="Av. Paulista, 1000, São Paulo - SP" />
    </div>
    <div id="originDeviceWrap" style="display:none;">
      <button id="btnGetLocation" type="button">Capturar minha localização agora</button>
      <div id="originDeviceInfo" class="muted">Nenhuma localização capturada ainda.</div>
    </div>

    <label>Destino</label>
    <input id="destination" value="Aeroporto de Congonhas, São Paulo - SP" />

    <label>Paradas (uma por linha)</label>
    <textarea id="stops">Rua Funchal, 500, São Paulo - SP
Shopping Eldorado, São Paulo - SP
Museu da Imagem e do Som, São Paulo - SP
Parque Ibirapuera, São Paulo - SP</textarea>

    <label>Minutos por parada (uma linha por parada, opcional)</label>
    <textarea id="stopDurations" placeholder="15
10
20
5"></textarea>

    <div class="row">
      <div>
        <label>Minutos padrão por parada</label>
        <input id="minutesPerStopDefault" type="number" min="0" step="1" value="10" />
      </div>
      <div>
        <label>Enviar duration no intermediate (experimental)</label>
        <select id="sendStopDurationToGoogle">
          <option value="true" selected>Sim (com fallback)</option>
          <option value="false">Não</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Tipo de condução</label>
        <select id="travelMode">
          <option value="DRIVE" selected>Carro</option>
          <option value="TWO_WHEELER">Moto</option>
          <option value="BICYCLE">Bicicleta</option>
          <option value="WALK">A pé</option>
        </select>
      </div>
      <div>
        <label>Preferência de trânsito</label>
        <select id="routingPreference">
          <option value="TRAFFIC_UNAWARE">TRAFFIC_UNAWARE</option>
          <option value="TRAFFIC_AWARE" selected>TRAFFIC_AWARE</option>
          <option value="TRAFFIC_AWARE_OPTIMAL">TRAFFIC_AWARE_OPTIMAL</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="btnShow">Quero ver no mapa</button>
      <button id="btnOpenGoogleMaps">Abrir Google Maps (web)</button>
      <button id="btnOpenGoogleMapsApp">Abrir Google Maps (app)</button>
    </div>

    <div id="status" style="margin-top:10px;"></div>
    <div id="summary"></div>
    <div id="legDetails"></div>

    <details style="margin-top:10px;">
      <summary>Payload enviado</summary>
      <pre id="payloadPreview"></pre>
    </details>
    <details style="margin-top:10px;">
      <summary>Logs/Debug</summary>
      <pre id="debug"></pre>
    </details>
  </div>

  <div class="panel"><div id="map"></div></div>
</div>

<script>
const ROUTES_URL = "https://routes.googleapis.com/directions/v2:computeRoutes";
let map, markers=[], polylines=[], deviceLocation=null, debugLines=[];
let lastOrigin=null,lastOriginCoord=null,lastDestination=null,lastOrderedStops=[];

const logDebug=(m,o)=>{const l=o?`${m}\n${JSON.stringify(o,null,2)}`:m;debugLines.push(l);document.getElementById("debug").textContent=debugLines.join("\n\n---\n\n");};
const setStatus=(m,t="ok")=>{const e=document.getElementById("status");e.className=t;e.textContent=m;};
const parseLines=t=>t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
const durationToSec=d=>{const n=parseInt(String(d||"").replace("s",""),10);return Number.isNaN(n)?0:n;};
const formatSec=sec=>`${Math.floor(sec/3600)}h ${Math.floor((sec%3600)/60)}min`;
const formatLatLng=ll=>`${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}`;

function onOriginModeChange(){
  const mode=document.getElementById("originMode").value;
  document.getElementById("originAddressWrap").style.display=mode==="address"?"block":"none";
  document.getElementById("originDeviceWrap").style.display=mode==="device"?"block":"none";
}

async function captureDeviceLocation(){
  if(!navigator.geolocation) throw new Error("Geolocalização não suportada.");
  const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000,maximumAge:0}));
  deviceLocation={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy};
  document.getElementById("originDeviceInfo").textContent=`Localização: ${formatLatLng(deviceLocation)} (±${Math.round(deviceLocation.accuracy)}m)`;
}
async function ensureDeviceIfNeeded(){ if(document.getElementById("originMode").value==="device" && !deviceLocation) await captureDeviceLocation(); }
function getOriginInput(){
  if(document.getElementById("originMode").value==="device"){
    if(!deviceLocation) throw new Error("Sem localização atual.");
    return { forApi:{ location:{ latLng:{ latitude:deviceLocation.lat, longitude:deviceLocation.lng } } }, label:`Minha localização (${formatLatLng(deviceLocation)})`, coord:{...deviceLocation}, text:null };
  }
  const origin=document.getElementById("origin").value.trim();
  if(!origin) throw new Error("Informe origem.");
  return { forApi:{address:origin}, label:origin, coord:null, text:origin };
}
function getDepartureISO(){ return new Date(Date.now()+5*60*1000).toISOString(); }

function buildStopMinutes(stops){
  const custom=parseLines(document.getElementById("stopDurations").value).map(v=>Math.max(0,parseInt(v,10)||0));
  const def=Math.max(0,parseInt(document.getElementById("minutesPerStopDefault").value||"0",10)||0);
  return stops.map((s,i)=>({address:s, stopDurationMinutes: custom[i] ?? def}));
}

function makeIntermediates(stopsWithMinutes, includeDuration){
  if(!includeDuration) return stopsWithMinutes.map(x=>({address:x.address}));
  return stopsWithMinutes.map(x=>({
    address:x.address,
    duration: `${x.stopDurationMinutes * 60}s` // experimental (pode ser rejeitado)
  }));
}

async function callComputeRoutes(apiKey, body){
  document.getElementById("payloadPreview").textContent = JSON.stringify(body,null,2);
  const res = await fetch(ROUTES_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "X-Goog-Api-Key":apiKey,
      "X-Goog-FieldMask":"routes.distanceMeters,routes.duration,routes.polyline.encodedPolyline,routes.optimizedIntermediateWaypointIndex,routes.legs.distanceMeters,routes.legs.duration,routes.legs.steps.startLocation.latLng,routes.legs.steps.endLocation.latLng"
    },
    body:JSON.stringify(body)
  });
  const txt=await res.text();
  let data={}; try{data=JSON.parse(txt);}catch{data={raw:txt};}
  return {res,data};
}

async function computeRouteWithFallback(apiKey, originForApi, destination, stopsWithMinutes, routingPreference, travelMode, optimizeWaypointOrder){
  const sendDuration = document.getElementById("sendStopDurationToGoogle").value === "true";
  const base = {
    origin: originForApi,
    destination: { address: destination },
    travelMode,
    routingPreference,
    optimizeWaypointOrder,
    departureTime: getDepartureISO(),
    languageCode:"pt-BR",
    units:"METRIC"
  };

  // tentativa 1: com duration no intermediate
  if(sendDuration){
    const body1={...base, intermediates: makeIntermediates(stopsWithMinutes, true)};
    const r1=await callComputeRoutes(apiKey, body1);
    logDebug("Tentativa 1 (com duration em intermediates)", r1.data);
    if(r1.res.ok && r1.data?.routes?.[0]) return {route:r1.data.routes[0], usedDurationInGoogle:true};

    logDebug("Google rejeitou/ignorou duration em intermediates. Fallback sem duration.", {
      status:r1.res.status, error:r1.data?.error?.message||null
    });
  }

  // tentativa 2: sem duration (compatível)
  const body2={...base, intermediates: makeIntermediates(stopsWithMinutes, false)};
  const r2=await callComputeRoutes(apiKey, body2);
  logDebug("Tentativa 2 (sem duration em intermediates)", r2.data);

  if(!r2.res.ok) throw new Error(r2.data?.error?.message || `HTTP ${r2.res.status}`);
  const route = r2.data?.routes?.[0];
  if(!route) throw new Error("Nenhuma rota retornada.");
  return {route, usedDurationInGoogle:false};
}

function ensureMap(){
  if(!window.google||!google.maps) throw new Error("Maps JS não carregou.");
  if(!map) map=new google.maps.Map(document.getElementById("map"),{center:{lat:-23.5505,lng:-46.6333},zoom:11});
}
function clearMap(){ markers.forEach(m=>m.setMap(null)); markers=[]; polylines.forEach(p=>p.setMap(null)); polylines=[]; }
function addMarker(position,label,title){
  const m=new google.maps.Marker({position,map,title,label:{text:label,color:"#fff"},icon:{path:google.maps.SymbolPath.CIRCLE,fillColor:"#1a73e8",fillOpacity:1,strokeColor:"#fff",strokeWeight:2,scale:11}});
  markers.push(m);
}
function decodePolyline(encoded){let i=0,lat=0,lng=0,c=[];while(i<encoded.length){let b,s=0,r=0;do{b=encoded.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);lat+=(r&1)?~(r>>1):(r>>1);s=0;r=0;do{b=encoded.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);lng+=(r&1)?~(r>>1):(r>>1);c.push({lat:lat/1e5,lng:lng/1e5});}return c;}

function buildGoogleMapsWebUrl(originRef,destination,orderedStops,travelMode){
  const params=new URLSearchParams();
  params.set("api","1");
  params.set("origin",typeof originRef==="string"?originRef:`${originRef.lat},${originRef.lng}`);
  params.set("destination",destination);
  params.set("travelmode", travelMode==="WALK"?"walking":travelMode==="BICYCLE"?"bicycling":"driving");
  if(orderedStops?.length) params.set("waypoints",orderedStops.join("|"));
  return `https://www.google.com/maps/dir/?${params.toString()}`;
}
function openInGoogleMapsWeb(){
  if(!lastDestination) return setStatus("Calcule a rota primeiro.","err");
  const originRef=lastOriginCoord||lastOrigin; if(!originRef) return setStatus("Origem inválida.","err");
  const travelMode=document.getElementById("travelMode").value;
  window.open(buildGoogleMapsWebUrl(originRef,lastDestination,lastOrderedStops,travelMode),"_blank","noopener,noreferrer");
}
function openInGoogleMapsApp(){ openInGoogleMapsWeb(); }

async function loadMapsScript(apiKey){
  return new Promise((resolve,reject)=>{
    if(window.google&&window.google.maps) return resolve();
    window.__initMap=()=>resolve();
    const s=document.createElement("script");
    s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&v=weekly&callback=__initMap`;
    s.async=true; s.defer=true; s.onerror=()=>reject(new Error("Falha Maps JS"));
    document.head.appendChild(s);
  });
}

async function showMapFlow(){
  debugLines=[]; document.getElementById("debug").textContent="";
  document.getElementById("summary").innerHTML=""; document.getElementById("legDetails").innerHTML="";

  const apiKey=document.getElementById("apiKey").value.trim();
  const destination=document.getElementById("destination").value.trim();
  const stops=parseLines(document.getElementById("stops").value);
  const travelMode=document.getElementById("travelMode").value;
  const routingPreference=document.getElementById("routingPreference").value;
  const optimizeWaypointOrder=document.getElementById("optimizeOrder").value==="true";
  if(!apiKey) throw new Error("Informe a API key.");
  if(!destination) throw new Error("Informe destino.");

  await ensureDeviceIfNeeded();
  const originInput=getOriginInput();
  const stopsWithMinutes=buildStopMinutes(stops);

  setStatus("1/3 Carregando mapa...","warn");
  await loadMapsScript(apiKey);

  setStatus("2/3 Calculando rota...","warn");
  const {route, usedDurationInGoogle} = await computeRouteWithFallback(
    apiKey, originInput.forApi, destination, stopsWithMinutes, routingPreference, travelMode, optimizeWaypointOrder
  );

  const idx=route.optimizedIntermediateWaypointIndex||[];
  const orderedStops = idx.length ? idx.map(i=>stopsWithMinutes[i]) : stopsWithMinutes.slice();

  setStatus("3/3 Desenhando...","warn");
  ensureMap(); clearMap();

  const encoded=route.polyline?.encodedPolyline||"";
  const path=decodePolyline(encoded);
  const line=new google.maps.Polyline({path,map,strokeColor:"#1a73e8",strokeOpacity:0.95,strokeWeight:5});
  polylines.push(line);

  const bounds=new google.maps.LatLngBounds(); path.forEach(p=>bounds.extend(p));

  const legs=route.legs||[];
  const legRows=[];
  for(let i=0;i<legs.length;i++){
    const from=i===0?originInput.label:(orderedStops[i-1]?.address||`Parada ${i}`);
    const to=i<orderedStops.length?(orderedStops[i]?.address||`Parada ${i+1}`):destination;
    legRows.push({
      from,to,
      dist:legs[i].distanceMeters||0,
      sec:durationToSec(legs[i].duration)
    });
  }

  if(legs.length){
    const s0=legs[0]?.steps?.[0]?.startLocation?.latLng;
    if(s0) addMarker({lat:s0.latitude,lng:s0.longitude},"I","Início");
    for(let i=0;i<orderedStops.length;i++){
      const e=legs[i]?.steps?.[legs[i].steps.length-1]?.endLocation?.latLng;
      if(e) addMarker({lat:e.latitude,lng:e.longitude},String(i+1),orderedStops[i].address);
    }
    const le=legs[legs.length-1]?.steps?.[legs[legs.length-1].steps.length-1]?.endLocation?.latLng;
    if(le) addMarker({lat:le.latitude,lng:le.longitude},"F","Fim");
  }

  if(!bounds.isEmpty()) map.fitBounds(bounds);

  const transitSec=legRows.reduce((a,b)=>a+b.sec,0);
  const stopSec=orderedStops.reduce((a,b)=>a+(b.stopDurationMinutes*60),0);
  const adjusted=transitSec+stopSec;

  lastOrigin=originInput.text; lastOriginCoord=originInput.coord; lastDestination=destination; lastOrderedStops=orderedStops.map(x=>x.address);

  document.getElementById("summary").innerHTML=`
    <p><strong>Google considerou duration no intermediate:</strong> ${usedDurationInGoogle ? "SIM (experimental)" : "NÃO (fallback sem duration)"}</p>
    <p><strong>Tempo em trânsito:</strong> ${formatSec(transitSec)}</p>
    <p><strong>Tempo de parada (payload custom):</strong> ${formatSec(stopSec)}</p>
    <p><strong>Tempo total ajustado:</strong> ${formatSec(adjusted)}</p>
  `;

  document.getElementById("legDetails").innerHTML=`
    <table>
      <thead><tr><th>#</th><th>De</th><th>Para</th><th>Distância</th><th>Duração</th><th>Parada</th></tr></thead>
      <tbody>
      ${legRows.map((r,i)=>`<tr>
        <td>${i+1}</td><td>${r.from}</td><td>${r.to}</td>
        <td>${(r.dist/1000).toFixed(2)} km</td><td>${formatSec(r.sec)}</td>
        <td>${orderedStops[i]?.stopDurationMinutes ?? 0} min</td>
      </tr>`).join("")}
      </tbody>
    </table>
  `;

  setStatus("OK: rota calculada.", "ok");
}

document.getElementById("originMode").addEventListener("change", onOriginModeChange);
document.getElementById("btnGetLocation").addEventListener("click", async ()=>{
  try{ setStatus("Capturando localização...","warn"); await captureDeviceLocation(); setStatus("Localização capturada.","ok"); }
  catch(e){ setStatus(explainGeoError(e),"err"); }
});
document.getElementById("btnShow").addEventListener("click", async ()=>{ try{await showMapFlow();}catch(e){logDebug("Erro", {message:e.message,stack:e.stack}); setStatus(e.message,"err");}});
document.getElementById("btnOpenGoogleMaps").addEventListener("click", openInGoogleMapsWeb);
document.getElementById("btnOpenGoogleMapsApp").addEventListener("click", openInGoogleMapsApp);
onOriginModeChange();
</script>
</body>
</html>
