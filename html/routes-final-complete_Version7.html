<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rota completa (Version7 + vehicleStopover)</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; }
    .wrap { display:grid; grid-template-columns:480px 1fr; gap:12px; padding:12px; }
    .panel { border:1px solid #ddd; border-radius:10px; padding:12px; }
    #map { width:100%; height:92vh; border:1px solid #ddd; border-radius:10px; background:#f7f7f7; }
    label { display:block; margin-top:8px; font-weight:600; }
    input, textarea, button, select { width:100%; box-sizing:border-box; padding:8px; margin-top:4px; }
    textarea { min-height:140px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .actions { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px; }
    .ok{ color:#0b8043; font-weight:700 }
    .err{ color:#c5221f; font-weight:700 }
    .warn{ color:#b26a00; font-weight:700 }
    pre { background:#111; color:#eee; padding:10px; border-radius:8px; overflow:auto; max-height:280px; }
    .small { font-size:12px; color:#555; }
    table { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
    th, td { border:1px solid #ddd; padding:6px; text-align:left; }
    th { background:#f6f6f6; }
    .muted { color:#666; font-size:12px; margin-top:4px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h3 style="margin-top:0">Rota completa (vehicleStopover)</h3>

    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="YOUR_API_KEY" />

    <label>Origem</label>
    <select id="originMode">
      <option value="address" selected>Usar endereço digitado</option>
      <option value="device">Usar minha localização agora</option>
    </select>

    <div id="originAddressWrap">
      <label>Início</label>
      <input id="origin" value="Av. Paulista, 1000, São Paulo - SP" />
    </div>

    <div id="originDeviceWrap" style="display:none;">
      <button id="btnGetLocation" type="button">Capturar minha localização agora</button>
      <div id="originDeviceInfo" class="muted">Nenhuma localização capturada ainda.</div>
    </div>

    <label>Destino</label>
    <input id="destination" value="Aeroporto de Congonhas, São Paulo - SP" />

    <label>Paradas (uma por linha)</label>
    <textarea id="stops">Rua Funchal, 500, São Paulo - SP
Shopping Eldorado, São Paulo - SP
Museu da Imagem e do Som, São Paulo - SP
Parque Ibirapuera, São Paulo - SP</textarea>

    <div class="row">
      <div>
        <label>Minutos por parada (global)</label>
        <input id="minutesPerStop" type="number" min="0" step="1" value="10" />
      </div>
      <div>
        <label>Enviar duration em intermediates</label>
        <select id="tryIntermediateDuration">
          <option value="true" selected>Sim (experimental + fallback)</option>
          <option value="false">Não</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Tipo de condução</label>
        <select id="travelMode">
          <option value="DRIVE" selected>Carro</option>
          <option value="TWO_WHEELER">Moto</option>
          <option value="BICYCLE">Bicicleta</option>
          <option value="WALK">A pé</option>
        </select>
      </div>
      <div>
        <label>Preferência de trânsito</label>
        <select id="routingPreference">
          <option value="TRAFFIC_UNAWARE">TRAFFIC_UNAWARE</option>
          <option value="TRAFFIC_AWARE" selected>TRAFFIC_AWARE</option>
          <option value="TRAFFIC_AWARE_OPTIMAL">TRAFFIC_AWARE_OPTIMAL</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Otimizar ordem das paradas</label>
        <select id="optimizeOrder">
          <option value="true" selected>Sim</option>
          <option value="false">Não</option>
        </select>
      </div>
      <div>
        <label>Partida</label>
        <select id="departureMode">
          <option value="soon" selected>Sair em +5 minutos</option>
          <option value="manual">Escolher data/hora</option>
          <option value="none">Não enviar departureTime</option>
        </select>
      </div>
    </div>

    <label>Data/hora (manual)</label>
    <input id="manualDeparture" type="datetime-local" />

    <div class="actions">
      <button id="btnShow">Quero ver no mapa</button>
      <button id="btnOpenGoogleMaps">Abrir Google Maps (web)</button>
      <button id="btnOpenGoogleMapsApp">Abrir Google Maps (app)</button>
    </div>

    <div id="status" style="margin-top:10px;"></div>
    <div id="summary"></div>
    <div id="legDetails"></div>

    <details style="margin-top:10px;">
      <summary>Payload enviado</summary>
      <pre id="payloadPreview"></pre>
    </details>

    <details style="margin-top:10px;">
      <summary>Logs/Debug</summary>
      <pre id="debug"></pre>
    </details>
  </div>

  <div class="panel"><div id="map"></div></div>
</div>

<script>
const ROUTES_URL = "https://routes.googleapis.com/directions/v2:computeRoutes";
let map, markers=[], polylines=[], deviceLocation=null, debugLines=[];
let lastOrigin=null,lastOriginCoord=null,lastDestination=null,lastOrderedStops=[];

function byId(id){
  const el=document.getElementById(id);
  if(!el) throw new Error(`Elemento não encontrado no HTML: #${id}`);
  return el;
}
const getVal=(id,fallback="")=>document.getElementById(id)?.value ?? fallback;
const logDebug=(m,o)=>{const l=o?`${m}\n${JSON.stringify(o,null,2)}`:m;debugLines.push(l);byId("debug").textContent=debugLines.join("\n\n---\n\n");};
const setStatus=(m,t="ok")=>{const e=byId("status");e.className=t;e.textContent=m;};
const parseLines=t=>t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
const durationToSec=d=>{const n=parseInt(String(d||"").replace("s",""),10);return Number.isNaN(n)?0:n;};
const formatSec=sec=>`${Math.floor(sec/3600)}h ${Math.floor((sec%3600)/60)}min`;
const formatLatLng=ll=>`${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}`;

function onOriginModeChange(){
  const mode=getVal("originMode","address");
  byId("originAddressWrap").style.display=mode==="address"?"block":"none";
  byId("originDeviceWrap").style.display=mode==="device"?"block":"none";
}

async function captureDeviceLocation(){
  if(!navigator.geolocation) throw new Error("Geolocalização não suportada.");
  const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000,maximumAge:0}));
  deviceLocation={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy};
  byId("originDeviceInfo").textContent=`Localização: ${formatLatLng(deviceLocation)} (±${Math.round(deviceLocation.accuracy)}m)`;
}
async function ensureDeviceIfNeeded(){ if(getVal("originMode","address")==="device" && !deviceLocation) await captureDeviceLocation(); }

function getOriginInput(){
  if(getVal("originMode","address")==="device"){
    if(!deviceLocation) throw new Error("Não foi possível obter localização atual.");
    return {
      forApi:{ location:{ latLng:{ latitude:deviceLocation.lat, longitude:deviceLocation.lng } } },
      label:`Minha localização (${formatLatLng(deviceLocation)})`,
      coord:{...deviceLocation},
      text:null
    };
  }
  const origin=byId("origin").value.trim();
  if(!origin) throw new Error("Informe origem.");
  return { forApi:{address:origin}, label:origin, coord:null, text:origin };
}

function getDepartureISO(){
  const mode=getVal("departureMode","soon");
  const manual=getVal("manualDeparture","");
  if(mode==="none") return null;
  if(mode==="soon") return new Date(Date.now()+5*60*1000).toISOString();
  if(!manual) throw new Error("Preencha data/hora manual.");
  const d=new Date(manual); if(isNaN(d.getTime())) throw new Error("Data manual inválida.");
  return d.toISOString();
}

async function loadMapsScript(apiKey){
  return new Promise((resolve,reject)=>{
    if(window.google&&window.google.maps) return resolve();
    window.__initMap=()=>resolve();
    const s=document.createElement("script");
    s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&v=weekly&callback=__initMap`;
    s.async=true; s.defer=true; s.onerror=()=>reject(new Error("Falha Maps JS"));
    document.head.appendChild(s);
  });
}

function ensureMap(){
  if(!window.google||!google.maps) throw new Error("Maps JS não carregou.");
  if(!map) map=new google.maps.Map(byId("map"),{center:{lat:-23.5505,lng:-46.6333},zoom:11});
}
function clearMap(){ markers.forEach(m=>m.setMap(null)); markers=[]; polylines.forEach(p=>p.setMap(null)); polylines=[]; }
function addMarker(position,label,title){
  const m=new google.maps.Marker({
    position,map,title,label:{text:label,color:"#fff"},
    icon:{path:google.maps.SymbolPath.CIRCLE,fillColor:"#1a73e8",fillOpacity:1,strokeColor:"#fff",strokeWeight:2,scale:11}
  });
  markers.push(m);
}
function decodePolyline(encoded){let i=0,lat=0,lng=0,c=[];while(i<encoded.length){let b,s=0,r=0;do{b=encoded.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);lat+=(r&1)?~(r>>1):(r>>1);s=0;r=0;do{b=encoded.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);lng+=(r&1)?~(r>>1):(r>>1);c.push({lat:lat/1e5,lng:lng/1e5});}return c;}

async function postComputeRoutes(apiKey, body){
  byId("payloadPreview").textContent = JSON.stringify(body, null, 2);
  const res=await fetch(ROUTES_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "X-Goog-Api-Key":apiKey,
      "X-Goog-FieldMask":"routes.distanceMeters,routes.duration,routes.polyline.encodedPolyline,routes.optimizedIntermediateWaypointIndex,routes.legs.distanceMeters,routes.legs.duration,routes.legs.steps.startLocation.latLng,routes.legs.steps.endLocation.latLng"
    },
    body:JSON.stringify(body)
  });
  const txt=await res.text();
  let data={}; try{data=JSON.parse(txt);}catch{data={raw:txt};}
  return {res,data};
}

async function computeRoute(apiKey, originForApi, destination, stops, routingPreference, travelMode, optimizeWaypointOrder, departureISO){
  const tryDuration = getVal("tryIntermediateDuration","true")==="true";
  const minutesPerStop = Math.max(0, parseInt(getVal("minutesPerStop","0"),10)||0);

  const isMotorized = (travelMode === "DRIVE" || travelMode === "TWO_WHEELER");
  const useVehicleStopover = isMotorized;

  // routingPreference NÃO pode em WALK/BICYCLE
  const canUseRoutingPreference = isMotorized;

  // baseBody sem routingPreference por padrão; adiciona só se permitido
  const baseBody = {
    origin: originForApi,
    destination: { address: destination },
    travelMode,
    optimizeWaypointOrder,
    languageCode: "pt-BR",
    units: "METRIC"
  };

  if (canUseRoutingPreference) {
    baseBody.routingPreference = routingPreference; // TRAFFIC_*
  } else {
    // log para ficar claro no debug
    logDebug("routingPreference removido: inválido para WALK/BICYCLE.", { travelMode, routingPreference });
  }

  if (departureISO) baseBody.departureTime = departureISO;

  const baseIntermediates = stops.map(s => {
    const wp = { address: s };
    if (useVehicleStopover) wp.vehicleStopover = true;
    return wp;
  });

  // tentativa 1: duration + (vehicleStopover se permitido)
  if (tryDuration) {
    const bodyWithDuration = {
      ...baseBody,
      intermediates: baseIntermediates.map(wp => ({
        ...wp,
        duration: `${minutesPerStop * 60}s` // experimental (pode falhar)
      }))
    };

    const r1 = await postComputeRoutes(apiKey, bodyWithDuration);
    logDebug("Tentativa #1 (duration + campos condicionais)", r1.data);

    if (r1.res.ok && r1.data?.routes?.[0]) {
      const route = r1.data.routes[0];
      const idx = route.optimizedIntermediateWaypointIndex || [];
      const orderedStops = idx.length ? idx.map(i => stops[i]) : stops.slice();
      return { route, orderedStops, durationAccepted: true, vehicleStopoverSent: useVehicleStopover };
    }

    const errMsg = r1.data?.error?.message || `HTTP ${r1.res.status}`;
    logDebug("duration rejeitado/não suportado. Fallback sem duration.", { error: errMsg });
  }

  // tentativa 2: sem duration
  const bodyPlain = {
    ...baseBody,
    intermediates: baseIntermediates
  };

  const r2 = await postComputeRoutes(apiKey, bodyPlain);
  logDebug("Tentativa #2 (sem duration, campos condicionais)", r2.data);

  if (!r2.res.ok) throw new Error(r2.data?.error?.message || `HTTP ${r2.res.status}`);
  const route = r2.data?.routes?.[0];
  if (!route) throw new Error("Nenhuma rota retornada.");

  const idx = route.optimizedIntermediateWaypointIndex || [];
  const orderedStops = idx.length ? idx.map(i => stops[i]) : stops.slice();
  return { route, orderedStops, durationAccepted: false, vehicleStopoverSent: useVehicleStopover };
}

function buildGoogleMapsWebUrl(originRef,destination,orderedStops,travelMode){
  const p=new URLSearchParams();
  p.set("api","1");
  p.set("origin",typeof originRef==="string"?originRef:`${originRef.lat},${originRef.lng}`);
  p.set("destination",destination);
  const modeMap={DRIVE:"driving",TWO_WHEELER:"driving",BICYCLE:"bicycling",WALK:"walking"};
  p.set("travelmode",modeMap[travelMode]||"driving");
  if(orderedStops?.length) p.set("waypoints",orderedStops.join("|"));
  return `https://www.google.com/maps/dir/?${p.toString()}`;
}

function openInGoogleMapsWeb(){
  if(!lastDestination) return setStatus("Calcule a rota primeiro.","err");
  const originRef=lastOriginCoord||lastOrigin;
  if(!originRef) return setStatus("Origem inválida.","err");
  const travelMode=getVal("travelMode","DRIVE");
  window.open(buildGoogleMapsWebUrl(originRef,lastDestination,lastOrderedStops,travelMode),"_blank","noopener,noreferrer");
}
function openInGoogleMapsApp(){ openInGoogleMapsWeb(); }

async function showMapFlow(){
  debugLines=[]; byId("debug").textContent="";
  byId("summary").innerHTML=""; byId("legDetails").innerHTML=""; byId("payloadPreview").textContent="";

  const apiKey=byId("apiKey").value.trim();
  const destination=byId("destination").value.trim();
  const stops=parseLines(byId("stops").value);

  const travelMode=getVal("travelMode","DRIVE");
  const routingPreference=getVal("routingPreference","TRAFFIC_AWARE");
  const optimizeWaypointOrder=getVal("optimizeOrder","true")==="true";
  const departureISO=getDepartureISO();

  if(!apiKey) throw new Error("Informe a API key.");
  if(!destination) throw new Error("Informe destino.");

  await ensureDeviceIfNeeded();
  const originInput=getOriginInput();

  setStatus("1/3 Carregando mapa...","warn");
  await loadMapsScript(apiKey);

  setStatus("2/3 Calculando rota...","warn");
  const {route,orderedStops,durationAccepted,vehicleStopoverSent}=await computeRoute(
    apiKey,originInput.forApi,destination,stops,routingPreference,travelMode,optimizeWaypointOrder,departureISO
  );

  setStatus("3/3 Desenhando...","warn");
  ensureMap(); clearMap();

  const path=decodePolyline(route.polyline?.encodedPolyline||"");
  const pl=new google.maps.Polyline({path,map,strokeColor:"#1a73e8",strokeOpacity:0.95,strokeWeight:5});
  polylines.push(pl);

  const bounds=new google.maps.LatLngBounds(); path.forEach(p=>bounds.extend(p));

  const legs=route.legs||[];
  const rows=[];
  for(let i=0;i<legs.length;i++){
    rows.push({
      from:i===0?originInput.label:orderedStops[i-1]||`Parada ${i}`,
      to:i<orderedStops.length?orderedStops[i]:destination,
      dist:legs[i].distanceMeters||0,
      sec:durationToSec(legs[i].duration)
    });
  }

  if(legs.length){
    const s0=legs[0]?.steps?.[0]?.startLocation?.latLng;
    if(s0){ addMarker({lat:s0.latitude,lng:s0.longitude},"I","Início"); bounds.extend({lat:s0.latitude,lng:s0.longitude}); }
    for(let i=0;i<orderedStops.length;i++){
      const e=legs[i]?.steps?.[legs[i].steps.length-1]?.endLocation?.latLng;
      if(e){ addMarker({lat:e.latitude,lng:e.longitude},String(i+1),orderedStops[i]); bounds.extend({lat:e.latitude,lng:e.longitude}); }
    }
    const le=legs[legs.length-1]?.steps?.[legs[legs.length-1].steps.length-1]?.endLocation?.latLng;
    if(le){ addMarker({lat:le.latitude,lng:le.longitude},"F","Fim"); bounds.extend({lat:le.latitude,lng:le.longitude}); }
  }

  if(!bounds.isEmpty()) map.fitBounds(bounds);

  const totalTransit=rows.reduce((a,b)=>a+b.sec,0);
  const minutesPerStop=Math.max(0,parseInt(getVal("minutesPerStop","0"),10)||0);
  const stopSec = orderedStops.length * minutesPerStop * 60;
  const adjusted = totalTransit + stopSec;

  lastOrigin=originInput.text;
  lastOriginCoord=originInput.coord;
  lastDestination=destination;
  lastOrderedStops=orderedStops;

  byId("summary").innerHTML=`
    <p><strong>Origem:</strong> ${originInput.label}</p>
    <p><strong>Modo:</strong> ${travelMode}</p>
    <p><strong>vehicleStopover enviado:</strong> ${vehicleStopoverSent ? "SIM" : "NÃO"}</p>
    <p><strong>Duration em intermediates aceito:</strong> ${durationAccepted ? "SIM" : "NÃO (fallback sem duration)"}</p>
    <p><strong>Distância total:</strong> ${((route.distanceMeters||0)/1000).toFixed(2)} km</p>
    <p><strong>Tempo em trânsito:</strong> ${formatSec(totalTransit)}</p>
    <p><strong>Tempo de parada (estimado):</strong> ${formatSec(stopSec)}</p>
    <p><strong>Tempo total ajustado:</strong> ${formatSec(adjusted)}</p>
  `;

  byId("legDetails").innerHTML=`
    <table>
      <thead><tr><th>#</th><th>De</th><th>Para</th><th>Distância</th><th>Duração</th></tr></thead>
      <tbody>
      ${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.from}</td><td>${r.to}</td><td>${(r.dist/1000).toFixed(2)} km</td><td>${formatSec(r.sec)}</td></tr>`).join("")}
      </tbody>
    </table>
  `;
  setStatus("OK: rota renderizada.", "ok");
}

byId("originMode").addEventListener("change", onOriginModeChange);
byId("btnGetLocation").addEventListener("click", async ()=>{
  try{ setStatus("Capturando localização...","warn"); await captureDeviceLocation(); setStatus("Localização capturada.","ok"); }
  catch(e){ setStatus(e.message,"err"); logDebug("Erro geolocalização",{message:e.message,code:e.code||null}); }
});
byId("btnShow").addEventListener("click", async ()=>{
  try{ await showMapFlow(); }
  catch(e){ logDebug("Erro",{message:e.message,stack:e.stack}); setStatus(e.message,"err"); }
});
byId("btnOpenGoogleMaps").addEventListener("click", openInGoogleMapsWeb);
byId("btnOpenGoogleMapsApp").addEventListener("click", openInGoogleMapsApp);

onOriginModeChange();
</script>
</body>
</html>
